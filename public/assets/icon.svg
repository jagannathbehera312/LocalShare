<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  
  <!-- Subtle inner shadow overlay -->
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />
  
  <!-- Stylized Droplet / Beam Arrow -->
  <g transform="translate(106, 86)" filter="url(#glow)">
    <!-- Droplet / Cloud Base -->
    <path d="M150 40 C90 40 40 90 40 150 C40 220 150 320 150 320 C150 320 260 220 260 150 C260 90 210 40 150 40 Z" fill="url(#grad2)" />
    
    <!-- Central fast-transfer beam arrows -->
    <path d="M150 110 L110 165 L135 165 L135 235 L165 235 L165 165 L190 165 Z" fill="#6366f1" />
    
    <!-- Pulse rings -->
    <circle cx="150" cy="180" r="110" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-dasharray="16 12" />
  </g>
</svg>
